android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Speicher: die frueheren Werte (-Xmx640m, workers.max=1) waren eine
# Notmassnahme fuer eine 1,5-GB-Sandbox, in der R8 viermal am OOM scheiterte
# (24/25-build-log). Auf einer Build-Maschine ab 4 GB gelten wieder normale
# Werte — hier gemessen: Release-AAB mit R8 laeuft damit durch.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true
kotlin.compiler.execution.strategy=daemon
